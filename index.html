<!doctype html>
<html lang="ru">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width,initial-scale=1,viewport-fit=cover">
<meta name="description" content="Бесплатный тренажёр к венгерскому экзамену по культуре (magyar kulturális ismereti vizsga): 6 тем, разбор каждого венгерского слова, практика и пробные экзамены.">
<style>:root{padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px)}body{margin:0}img{max-width:100%}[hidden]{display:none!important}</style>
<title>Magyar Vizsga Tréner</title>
<link rel="preconnect" href="https://fonts.googleapis.com">
<link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link rel="stylesheet" href="https://fonts.googleapis.com/css2?family=Figtree:wght@400;500;600;700;800&family=Onest:wght@400;500;600;700;800&display=swap">
<style>
/* Layout: one calm column like an exam workbook; the loud part is the tricolour stitch and the crown-gold of mastery. */
:root {
  --bg: #F1F4EF;
  --card: #FFFFFF;
  --ink: #17231D;
  --muted: #5B6B62;
  --line: #D8DFD8;
  --soft: #E6ECE5;
  --paprika: #C0392B;
  --paprika-soft: #F8E3DF;
  --meadow: #2E6A4C;
  --meadow-soft: #DDEEE3;
  --gold: #B8860B;
  --gold-soft: #F6EBCB;
  --blue: #2F5D8A;
  --blue-soft: #DDE8F3;
  --shadow: 0 1px 2px rgba(23,35,29,.06), 0 6px 20px rgba(23,35,29,.06);
  /* Figtree has no Cyrillic: Russian letters fall through to Onest, a close geometric match */
  --f-display: "Figtree", "Onest", system-ui, sans-serif;
  --f-body: "Figtree", "Onest", system-ui, -apple-system, "Segoe UI", sans-serif;
  --r: 14px;
  color-scheme: light;
}
@media (prefers-color-scheme: dark) {
  :root:not([data-theme="light"]) {
    --bg: #0F1512; --card: #18211C; --ink: #E6ECE7; --muted: #9AAAA0; --line: #2A362F; --soft: #202B25;
    --paprika: #E9705E; --paprika-soft: #3A211D; --meadow: #63B78C; --meadow-soft: #1C3328;
    --gold: #E2B64B; --gold-soft: #3A3019; --blue: #7FA9D6; --blue-soft: #1B2A3A;
    --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
    color-scheme: dark;
  }
}
:root[data-theme="dark"] {
  --bg: #0F1512; --card: #18211C; --ink: #E6ECE7; --muted: #9AAAA0; --line: #2A362F; --soft: #202B25;
  --paprika: #E9705E; --paprika-soft: #3A211D; --meadow: #63B78C; --meadow-soft: #1C3328;
  --gold: #E2B64B; --gold-soft: #3A3019; --blue: #7FA9D6; --blue-soft: #1B2A3A;
  --shadow: 0 1px 2px rgba(0,0,0,.3), 0 6px 20px rgba(0,0,0,.25);
  color-scheme: dark;
}
* { box-sizing: border-box; }
body { background: var(--bg); color: var(--ink); font-family: var(--f-body); font-size: 16px; line-height: 1.5; margin: 0; }
#app { max-width: 680px; margin: 0 auto; padding-inline: 16px; padding-block: 12px 64px; display: flex; flex-direction: column; gap: 16px; }
h1, h2, h3 { font-family: var(--f-display); font-weight: 800; line-height: 1.2; margin: 0; text-wrap: balance; letter-spacing: -.015em; }
h1 { font-size: 1.6rem; } h2 { font-size: 1.2rem; font-weight: 700; } h3 { font-size: 1rem; }
p { margin: 0; }
button { font: inherit; color: inherit; }
img { max-width: 100%; display: block; }
.muted { color: var(--muted); }
.small { font-size: .875rem; }
.eyebrow { font-size: .75rem; letter-spacing: .08em; text-transform: uppercase; color: var(--muted); font-weight: 600; }
.row { display: flex; gap: 10px; align-items: center; flex-wrap: wrap; }
.stack { display: flex; flex-direction: column; gap: 12px; }
.spacer { flex: 1; }
.tnum { font-variant-numeric: tabular-nums; }

/* stitch: the tricolour cross-stitch band */
.stitch { height: 6px; border-radius: 3px; background:
  repeating-linear-gradient(90deg, var(--paprika) 0 10px, transparent 10px 14px, var(--line) 14px 24px, transparent 24px 28px, var(--meadow) 28px 38px, transparent 38px 42px); opacity: .9; }

.card { background: var(--card); border: 1px solid var(--line); border-radius: var(--r); padding: 18px; box-shadow: var(--shadow); min-width: 0; }
.card.flat { box-shadow: none; }
.btn { display: inline-flex; align-items: center; justify-content: center; gap: 8px; border: 1px solid var(--line); background: var(--card); border-radius: 999px; padding: 10px 18px; font-weight: 600; cursor: pointer; min-height: 44px; transition: transform .08s ease, background .15s; }
.btn:hover { background: var(--soft); }
.btn:active { transform: scale(.98); }
.btn.primary { background: var(--ink); color: var(--bg); border-color: var(--ink); }
.btn.primary:hover { opacity: .92; background: var(--ink); }
.btn.go { background: var(--meadow); color: #fff; border-color: var(--meadow); }
.btn.ghost { border-color: transparent; background: transparent; }
.btn.ghost:hover { background: var(--soft); }
.btn[disabled] { opacity: .45; cursor: not-allowed; }
.btn.sm { min-height: 34px; padding: 6px 12px; font-size: .875rem; }
.iconbtn { width: 40px; height: 40px; border-radius: 50%; border: 1px solid var(--line); background: var(--card); display: inline-grid; place-items: center; cursor: pointer; flex: none; }
.iconbtn:hover { background: var(--soft); }
:focus-visible { outline: 3px solid var(--blue); outline-offset: 2px; }

/* top bar */
.top { display: flex; align-items: center; gap: 12px; padding-block: 4px; }
.brand { display: flex; align-items: center; gap: 10px; }
.brand-mark { width: 30px; height: 30px; border-radius: 8px; overflow: hidden; display: grid; grid-template-rows: 1fr 1fr 1fr; border: 1px solid var(--line); }
.brand-mark i:nth-child(1){ background:#CD2A3E } .brand-mark i:nth-child(2){ background:#fff } .brand-mark i:nth-child(3){ background:#436F4D }
.brand b { font-family: var(--f-display); font-weight: 600; font-size: 1.05rem; }
.pill { display: inline-flex; align-items: center; gap: 6px; border-radius: 999px; padding: 4px 10px; font-size: .8rem; font-weight: 600; background: var(--soft); color: var(--ink); white-space: nowrap; }
.pill.gold { background: var(--gold-soft); color: var(--gold); }
.pill.green { background: var(--meadow-soft); color: var(--meadow); }
.pill.red { background: var(--paprika-soft); color: var(--paprika); }
.pill.blue { background: var(--blue-soft); color: var(--blue); }

/* hero */
.hero { display: flex; flex-direction: column; gap: 14px; padding: 20px; }
.hero h1 { font-size: 1.45rem; }
.hero .meta { display: flex; gap: 8px; flex-wrap: wrap; }
.todo { display: flex; flex-direction: column; gap: 8px; }
.todo-item { display: flex; gap: 12px; align-items: center; padding: 10px 12px; border-radius: 12px; background: var(--soft); }
.todo-item .dot { width: 22px; height: 22px; border-radius: 50%; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; }
.todo-item.done .dot { background: var(--meadow); border-color: var(--meadow); color: #fff; }
.todo-item.done span.t { color: var(--muted); text-decoration: line-through; }

/* route */
.route { display: flex; gap: 3px; height: 14px; border-radius: 7px; overflow: hidden; position: relative; }
.route i { display: block; height: 100%; background: var(--soft); position: relative; }
.route i.on { background: var(--meadow-soft); }
.route i.done { background: var(--meadow); }
.route i.fin { background: var(--gold-soft); }
.route-now { position: absolute; top: -4px; width: 3px; height: 22px; background: var(--paprika); border-radius: 2px; }
.route-labels { display: flex; gap: 3px; font-size: .7rem; color: var(--muted); }
.route-labels span { overflow: hidden; white-space: nowrap; text-overflow: ellipsis; }

/* topics */
.topics { display: flex; flex-direction: column; gap: 10px; }
.topic { display: grid; grid-template-columns: 58px 1fr auto; gap: 14px; align-items: center; padding: 14px; border-radius: var(--r); background: var(--card); border: 1px solid var(--line); cursor: pointer; text-align: left; width: 100%; }
.topic:hover { border-color: var(--muted); }
.topic.locked { cursor: default; opacity: .6; }
.topic.locked:hover { border-color: var(--line); }
.topic .t-title { font-weight: 600; }
.topic .t-hu { font-size: .8rem; color: var(--muted); }
.ring { width: 58px; height: 58px; position: relative; }
.ring svg { width: 100%; height: 100%; transform: rotate(-90deg); }
.ring b { position: absolute; inset: 0; display: grid; place-items: center; font-family: var(--f-display); font-size: .8rem; font-weight: 600; }

/* stats */
.stats { display: grid; grid-template-columns: repeat(4, 1fr); gap: 10px; }
.stat { background: var(--card); border: 1px solid var(--line); border-radius: 12px; padding: 12px; min-width: 0; }
.stat b { display: block; font-family: var(--f-display); font-size: 1.3rem; font-weight: 600; font-variant-numeric: tabular-nums; }
.stat span { font-size: .75rem; color: var(--muted); }
@media (max-width: 520px) { .stats { grid-template-columns: repeat(2, 1fr); } }
.heat { display: grid; grid-template-columns: repeat(14, 1fr); gap: 4px; }
.heat i { aspect-ratio: 1; border-radius: 4px; background: var(--soft); display: block; }
.heat i.l1 { background: var(--meadow-soft); } .heat i.l2 { background: color-mix(in srgb, var(--meadow) 55%, var(--meadow-soft)); } .heat i.l3 { background: var(--meadow); }
.heat i.today { outline: 2px solid var(--paprika); outline-offset: 1px; }

.tools { display: grid; grid-template-columns: repeat(auto-fit, minmax(170px, 1fr)); gap: 10px; }
.tool { padding: 14px; border-radius: 12px; border: 1px solid var(--line); background: var(--card); cursor: pointer; text-align: left; display: flex; flex-direction: column; gap: 4px; min-width: 0; }
.tool:hover { border-color: var(--muted); }
.tool b { font-size: .95rem; }
.tool span { font-size: .8rem; color: var(--muted); }
@media (max-width: 520px) { .tools { grid-template-columns: 1fr; } }

/* lesson */
.bar { height: 6px; border-radius: 3px; background: var(--soft); overflow: hidden; flex: 1; }
.bar i { display: block; height: 100%; background: var(--meadow); border-radius: 3px; transition: width .3s ease; }
.lesson-head { display: flex; align-items: center; gap: 12px; position: sticky; top: env(safe-area-inset-top, 0px); background: var(--bg); padding-block: 8px; z-index: 5; }
.block { display: flex; flex-direction: column; gap: 14px; }
.block img.ill { border-radius: 10px; max-height: 340px; object-fit: contain; margin-inline: auto; background: var(--soft); }
.rich p + p { margin-top: 10px; }
.rich strong { font-weight: 700; }
.hu-big { font-size: 1.35rem; line-height: 1.55; font-weight: 500; }
.tr { color: var(--muted); border-top: 1px dashed var(--line); padding-top: 10px; }
.reveal { background: var(--soft); border: 1px dashed var(--line); border-radius: 10px; padding: 10px 12px; cursor: pointer; color: var(--muted); text-align: left; width: 100%; }
.mnemo { background: var(--gold-soft); border-color: transparent; }
.mnemo .eyebrow { color: var(--gold); }
.grammar { background: var(--blue-soft); border-color: transparent; }
.grammar .eyebrow { color: var(--blue); }
.wordlist { display: flex; flex-direction: column; gap: 8px; }
.wordrow { display: grid; grid-template-columns: minmax(0, 1fr) minmax(0, 1fr); gap: 10px; padding: 10px 12px; border-radius: 10px; background: var(--soft); align-items: baseline; }
.wordrow .hu { font-weight: 600; font-size: 1.05rem; }
.wordrow .tip { grid-column: 1 / -1; font-size: .85rem; color: var(--muted); }
.quote { border-left: 4px solid var(--gold); padding-left: 14px; }

/* gloss */
.w { border-bottom: 2px dotted color-mix(in srgb, var(--meadow) 60%, transparent); cursor: help; border-radius: 2px; }
.w:hover, .w.on { background: var(--meadow-soft); }
.hu-term { font-weight: 600; }
#tip { position: fixed; z-index: 50; max-width: 340px; width: calc(100vw - 32px); background: var(--card); color: var(--ink); border: 1px solid var(--line); border-radius: 14px; box-shadow: 0 10px 40px rgba(0,0,0,.18); padding: 14px 16px; display: flex; flex-direction: column; gap: 8px; font-size: .92rem; }
#tip .tw { font-family: var(--f-display); font-size: 1.05rem; font-weight: 600; }
#tip .tt { font-size: 1.05rem; font-weight: 600; color: var(--meadow); }
#tip .tl { color: var(--muted); font-size: .85rem; }
#tip .tp { font-family: ui-monospace, "SF Mono", Menlo, monospace; font-size: .82rem; background: var(--soft); padding: 4px 8px; border-radius: 6px; align-self: flex-start; }
#tip .tai { background: var(--blue-soft); border-radius: 10px; padding: 8px 10px; white-space: pre-wrap; }
@media (max-width: 560px) {
  #tip { left: 8px !important; right: 8px; top: auto !important; bottom: calc(8px + env(safe-area-inset-bottom, 0px)); max-width: none; width: auto; max-height: 60vh; overflow: auto; }
}

/* flag block */
.flag { width: 100%; max-width: 420px; aspect-ratio: 2 / 1; border-radius: 8px; overflow: hidden; border: 1px solid var(--line); display: grid; grid-template-rows: 1fr 1fr 1fr; margin-inline: auto; }
.flag button { border: 0; cursor: pointer; font-weight: 700; font-size: .95rem; display: grid; place-items: center; color: transparent; transition: filter .15s; }
.flag button.open { color: rgba(0,0,0,.72); }
.flag button.open.dk { color: rgba(255,255,255,.92); }
.flag button:hover { filter: brightness(1.05); }

/* hotspots */
.spot-wrap { position: relative; margin-inline: auto; width: 100%; }
.spot-wrap img { width: 100%; height: auto; border-radius: 10px; }
.spot { position: absolute; transform: translate(-50%, -50%); width: 32px; height: 32px; border-radius: 50%; border: 3px solid #fff; background: var(--paprika); color: #fff; font-weight: 700; font-size: .85rem; cursor: pointer; box-shadow: 0 2px 8px rgba(0,0,0,.35); display: grid; place-items: center; }
.spot.seen { background: var(--meadow); }
.spot.pick { background: var(--blue); outline: 3px solid var(--gold); }
.spot.ok { background: var(--meadow); } .spot.bad { background: var(--paprika); }
.spot-label { position: absolute; transform: translate(-50%, 18px); background: var(--card); color: var(--ink); font-size: .72rem; font-weight: 600; padding: 2px 6px; border-radius: 6px; white-space: nowrap; border: 1px solid var(--line); pointer-events: none; }
@keyframes pulse { 0%,100% { box-shadow: 0 0 0 0 rgba(192,57,43,.5); } 50% { box-shadow: 0 0 0 8px rgba(192,57,43,0); } }
.spot:not(.seen):not(.ok):not(.bad) { animation: pulse 2s infinite; }

/* duo flip */
.duo { display: grid; grid-template-columns: 1fr 1fr; gap: 12px; }
@media (max-width: 480px) { .duo { grid-template-columns: 1fr; } }
.flip { perspective: 1000px; cursor: pointer; min-height: 290px; border: 0; background: none; padding: 0; text-align: left; }
.flip-in { position: relative; width: 100%; height: 100%; min-height: 290px; transition: transform .5s; transform-style: preserve-3d; }
.flip.on .flip-in { transform: rotateY(180deg); }
.face { position: absolute; inset: 0; backface-visibility: hidden; border-radius: 14px; border: 1px solid var(--line); background: var(--card); padding: 14px; display: flex; flex-direction: column; gap: 8px; overflow: hidden; }
.face.back { transform: rotateY(180deg); background: var(--soft); }
.face img { width: 100%; height: 190px; object-fit: cover; object-position: top; border-radius: 10px; }
.face .big { font-family: var(--f-display); font-size: 1.2rem; font-weight: 600; }
.kv { display: grid; grid-template-columns: auto 1fr; gap: 6px 12px; }
.kv span { color: var(--muted); font-size: .85rem; }
.kv b { font-weight: 600; }
@media (prefers-reduced-motion: reduce) { .flip-in { transition: none; } .spot { animation: none !important; } }

/* calendar */
.cal { display: grid; grid-template-columns: repeat(3, 1fr); gap: 10px; }
@media (max-width: 520px) { .cal { grid-template-columns: 1fr; } }
.leaf { border: 1px solid var(--line); border-radius: 12px; background: var(--card); overflow: hidden; cursor: pointer; text-align: left; padding: 0; display: flex; flex-direction: column; }
.leaf .lt { background: var(--paprika); color: #fff; padding: 6px 10px; font-size: .75rem; font-weight: 600; letter-spacing: .06em; text-transform: uppercase; }
.leaf .ld { padding: 12px; display: flex; flex-direction: column; gap: 6px; }
.leaf .num { font-family: var(--f-display); font-size: 2rem; font-weight: 700; line-height: 1; }
.leaf .more { display: none; flex-direction: column; gap: 8px; }
.leaf.on .more { display: flex; }
.leaf.on .hint { display: none; }
canvas.fw { width: 100%; height: 120px; border-radius: 10px; background: #0d1b2a; display: block; }

/* timeline */
.tl { display: flex; flex-direction: column; gap: 0; position: relative; padding-left: 8px; }
.tl::before { content: ""; position: absolute; left: 49px; top: 8px; bottom: 8px; width: 3px; background: var(--soft); border-radius: 2px; }
.tl-ev { display: grid; grid-template-columns: 84px 1fr; gap: 12px; align-items: start; padding-block: 8px; position: relative; }
.tl-year { justify-self: center; z-index: 1; background: var(--paprika); color: #fff; font-weight: 800; font-size: .82rem; padding: 4px 8px; border-radius: 999px; font-variant-numeric: tabular-nums; white-space: nowrap; max-width: 84px; overflow: hidden; text-overflow: ellipsis; }
.tl-ev.seen .tl-year { background: var(--meadow); }
.tl-body { background: var(--soft); border-radius: 12px; padding: 10px 12px; cursor: pointer; text-align: left; border: 0; width: 100%; display: flex; flex-direction: column; gap: 6px; min-width: 0; }
.tl-body .cap { font-weight: 700; }
.tl-body .more { display: none; flex-direction: column; gap: 8px; }
.tl-ev.open .tl-body .more { display: flex; }
.tl-ev.open .tl-body .hint { display: none; }
.tl-body img { border-radius: 8px; max-height: 220px; object-fit: contain; }
.face .mono { height: 120px; border-radius: 10px; display: grid; place-items: center; font-family: var(--f-display); font-weight: 800; font-size: 2.4rem; color: var(--paprika); background: var(--paprika-soft); }
/* poem */
.poem { display: flex; flex-direction: column; gap: 10px; }
.poem .ln { font-size: 1.15rem; font-weight: 500; }
.poem .lr { font-size: .9rem; color: var(--muted); }

/* runner */
.qhead { display: flex; align-items: center; gap: 12px; }
.q { font-size: 1.2rem; font-weight: 600; line-height: 1.45; white-space: pre-line; }
.opts { display: flex; flex-direction: column; gap: 8px; }
.opt { text-align: left; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; min-height: 48px; display: flex; gap: 10px; align-items: center; }
.opt:hover { border-color: var(--muted); }
.opt.sel { border-color: var(--blue); background: var(--blue-soft); }
.opt.ok { border-color: var(--meadow); background: var(--meadow-soft); }
.opt.bad { border-color: var(--paprika); background: var(--paprika-soft); }
.opt.dk { color: var(--muted); border-style: dashed; justify-content: center; }
.opt .box { width: 20px; height: 20px; border-radius: 5px; border: 2px solid var(--muted); flex: none; display: grid; place-items: center; font-size: .75rem; }
.opt.sel .box { background: var(--blue); border-color: var(--blue); color: #fff; }
.tf { display: grid; grid-template-columns: 1fr 1fr; gap: 10px; }
.tf .opt { justify-content: center; flex-direction: column; gap: 0; font-weight: 700; }
.tf .opt small { font-weight: 400; color: var(--muted); }
.inp { width: 100%; font: inherit; font-size: 1.15rem; padding: 12px 14px; border-radius: 12px; border: 1.5px solid var(--line); background: var(--card); color: var(--ink); }
.inp:focus { outline: none; border-color: var(--blue); }
.keys { display: flex; flex-wrap: wrap; gap: 6px; }
.keys button { min-width: 38px; height: 38px; border-radius: 8px; border: 1px solid var(--line); background: var(--soft); cursor: pointer; font-size: 1rem; font-weight: 600; }
.match { display: grid; grid-template-columns: 1fr 1fr; gap: 8px; }
.match .col { display: flex; flex-direction: column; gap: 8px; min-width: 0; }
.mchip { padding: 10px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; text-align: left; min-height: 48px; word-break: break-word; }
.mchip.sel { border-color: var(--ink); box-shadow: 0 0 0 2px var(--ink) inset; }
.mchip.ok { border-color: var(--meadow); } .mchip.bad { border-color: var(--paprika); }
.pc0 { background: #FCE4E0 !important; } .pc1 { background: #DFF0E5 !important; } .pc2 { background: #DFE9F6 !important; } .pc3 { background: #F7ECCB !important; } .pc4 { background: #EDE2F5 !important; }
@media (prefers-color-scheme: dark) { :root:not([data-theme="light"]) .pc0 { background: #452823 !important; } :root:not([data-theme="light"]) .pc1 { background: #1F3A2B !important; } :root:not([data-theme="light"]) .pc2 { background: #1E3047 !important; } :root:not([data-theme="light"]) .pc3 { background: #423620 !important; } :root:not([data-theme="light"]) .pc4 { background: #37294A !important; } }
:root[data-theme="dark"] .pc0 { background: #452823 !important; } :root[data-theme="dark"] .pc1 { background: #1F3A2B !important; } :root[data-theme="dark"] .pc2 { background: #1E3047 !important; } :root[data-theme="dark"] .pc3 { background: #423620 !important; } :root[data-theme="dark"] .pc4 { background: #37294A !important; }
.tiles-ans { min-height: 58px; border-radius: 12px; border: 1.5px dashed var(--line); padding: 8px; display: flex; flex-wrap: wrap; gap: 6px; align-items: center; }
.tiles-pool { display: flex; flex-wrap: wrap; gap: 6px; }
.tile { padding: 8px 12px; border-radius: 10px; border: 1.5px solid var(--line); background: var(--card); cursor: pointer; font-weight: 600; font-size: 1rem; }
.tile.used { visibility: hidden; }
.palette { display: flex; flex-wrap: wrap; gap: 8px; }

/* ============ topic logic ============ */
function topicData(id) { return C.topics[id]; }

  if (st.last) return Math.round(st.last.pct);
  const fk = factKus(t);

  switch (it.type) {
    case "mcq": return it.opts[it.a];
    case "multi": return it.a.map(i => it.opts[i]).join(", ");
    case "tf": return it.a ? "igaz (верно)" : "hamis (неверно)";
    case "type": return it.accept[0];
    case "list": return it.items.map(g => g[0]).join(", ");
    case "match": return it.pairs.map(p => `${p[0]} — ${p[1]}`).join("; ");
    case "order": return it.items.join(" → ");
    case "tiles": return it.answer.join(" ");
    case "hotspot": return it.points.map((p, i) => `${i + 1}: ${p.label}`).join("; ");

  else reset.append(h("div", { class: "confirm" }, h("b", null, "Точно стереть весь прогресс? Это нельзя отменить."), h("div", { class: "row" }, h("button", { class: "btn", style: "border-color:var(--paprika);color:var(--paprika)", onclick: () => { S = freshState(); save(); flush(); go("home"); toast("Прогресс сброшен"); } }, "Да, стереть"), h("button", { class: "btn ghost", onclick: () => { route.p.confirm = false; render(); } }, "Отмена"))));
  out.push(reset);
  return out;
};

/* ============ boot ============ */
async function boot() {
  try {
    const get = f => fetch(f).then(r => { if (!r.ok) throw new Error(f); return r.json(); });
    const opt = f => get(f).catch(() => ({}));
    const [lex, grammar, credits] = await Promise.all([get("content/lex.json"), get("content/grammar.json"), get("content/credits.json").catch(() => [])]);
    C.lex = lex; C.grammar = grammar; C.credits = Array.isArray(credits) ? credits : [];
    C.guideCredits = await fetch("content/guide_credits.txt").then(r => r.ok ? r.text() : "").catch(() => "");
    await Promise.all(TOPICS.filter(t => t.ready).map(async m => {
      try {
        const [t, lx, gr] = await Promise.all([get(`content/${m.id}.json`), m.id === "t1" ? {} : opt(`content/lex_${m.id}.json`), m.id === "t1" ? {} : opt(`content/grammar_${m.id}.json`)]);
        C.lexT[m.id] = lx;
        for (const [k, v] of Object.entries(lx)) if (!C.lex[k]) C.lex[k] = v;
        Object.assign(C.grammar, gr);
        C.topics[m.id] = t; t.items.forEach(i => { itemById[i.id] = i; itemTopic[i.id] = m.id; }); t.kus.forEach(k => kuById[k.id] = k);
      } catch (e) { m.ready = false; }
    }));
    if (!C.topics.t1) throw new Error("t1");
  } catch (e) {
    app.replaceChildren(h("div", { class: "card" }, h("h2", null, "Не удалось загрузить учебник"), h("p", { class: "muted" }, "Обнови страницу. Если не поможет, напиши в чат, что видишь эту ошибку.")));
    return;
  }
  app.replaceChildren(h("div", { class: "card" }, h("p", { class: "muted" }, "Загружаю твой прогресс…")));
  await Promise.race([initStore(), new Promise(r => setTimeout(r, 5000))]);
  if (!resumeHere()) render();
  initAI();
}
boot();
</script>
